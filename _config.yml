# Hexo Configuration
title: HeisenBWY · 技术笔记
subtitle: 记录技术，整理思考
description: 记录技术，整理思考，让知识慢慢生长。
keywords: Linux,内核,内存管理,操作系统,技术笔记
author: HeisenBWY
language: zh-CN
timezone: Asia/Shanghai

url: https://heisenbwy.github.io/
permalink: posts/:title/
permalink_defaults:

pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
category_dir: categories
archive_dir: archives
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - diagrams/**

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: " "
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: false

# Home page setting
index_generator:
  path: ""
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 12
pagination_dir: page

# Theme
theme: anzhiyu

# Deployment
deploy:
  type: ""

marked:
  prependRoot: true
  postAsset: true
