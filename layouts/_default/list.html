{{ define "main" }}
<section class="page-heading"><p class="eyebrow">NOTEBOOK / {{ .Pages.Len }} 条记录</p><h1>{{ .Title }}</h1>{{ .Content }}</section>
{{ if eq .Kind "taxonomy" }}
<div class="tag-cloud">{{ range .Pages }}<a href="{{ .RelPermalink }}"># {{ .Title }} <span>{{ .Pages.Len }}</span></a>{{ end }}</div>
{{ else }}
{{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}
{{ end }}
{{ end }}
