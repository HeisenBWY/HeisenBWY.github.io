{{ define "main" }}
{{ $posts := where site.RegularPages "Section" "posts" }}
<section class="page-heading search-heading">
  <p class="eyebrow">SEARCH / {{ len $posts }} 篇文章</p>
  <h1>{{ .Title }}</h1>
  <p>{{ .Description }}</p>
  <form class="search-form" role="search" action="#" onsubmit="return false;">
    <label class="skip" for="search-input">输入搜索词</label>
    <input id="search-input" type="search" placeholder="搜索标题、标签或摘要，如：folio、内存回收…" autocomplete="off" autofocus>
  </form>
</section>
<section class="search-results" aria-label="搜索结果">
  <p class="search-status" aria-live="polite">输入关键词开始搜索。</p>
  <ol id="search-results-list"></ol>
</section>
<script src="{{ "js/site-search.js" | relURL }}" defer></script>
{{ end }}
